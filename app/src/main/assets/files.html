  ALB.forEach(a=>{if(a[3])sets[a[0]]=new Set((J('tagFiles',a[1])||[]).map(x=>x.p));});}
 items.forEach(it=>{const lp=it.p.toLowerCase(),ln=it.n.toLowerCase(),d=new Date(it.m*1000);
  it.ext=ln.split('.').pop()||'';it.dy=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();it.tm=d.getHours()*3600+d.getMinutes()*60+d.getSeconds();it.g=[];
  if(useAlb)ALB.forEach(a=>{if(a[2](lp,ln)||(sets[a[0]]&&sets[a[0]].has(it.p)))it.g.push(a[0]);});
  it.pg=it.g.length?AIDX[it.g[0]]:99;});
 return LIBC[cat]=items;}
function sortItems(items){const nm=(a,b)=>a.n.toLowerCase().localeCompare(b.n.toLowerCase());
 const f={date:(a,b)=>(a.dy-b.dy)||(a.m-b.m)||nm(a,b),time:(a,b)=>(a.tm-b.tm)||nm(a,b),size:(a,b)=>(a.s-b.s)||nm(a,b),name:nm,type:(a,b)=>a.ext.localeCompare(b.ext)||nm(a,b),genre:(a,b)=>(a.pg-b.pg)||(b.m-a.m)}[LSORT]||nm;
 return items.slice().sort((a,b)=>LDIR*f(a,b));}
function libChrome(){
 const alb=isAlb(V.cat);
 const vb=alb?'<button class="ib" onclick="cycleView()" aria-label="View">'+ic(VIEW==='grid'?'grid':VIEW==='wf'?'wf':'list')+'</button>':'';
 const sb=(!alb||V.album)?'<button class="ib" onclick="sortLib()" aria-label="Sort">'+ic('sort')+'</button>':'';
 setTop(subHeader(V.title,vb+sb+'<button class="ib" onclick="libMenu()" aria-label="More">'+ic('more')+'</button>'));}
function cycleView(){VIEW={grid:'wf',wf:'list',list:'grid'}[VIEW]||'grid';SV('pf_view',VIEW);SEL.clear();toast({grid:'Grid',wf:'Waterfall',list:'List'}[VIEW]);reload();}
function sortLib(){
 const o=[['date','Date'],['time','Time'],['size','Size'],['name','File name'],['type','Type']].concat(isAlb(V.cat)?[['genre','Genre']]:[]);
 sheet('<h3>Sort by</h3>'+o.map(x=>'<button class="row" data-s="'+x[0]+'"><span class="rt"><b>'+x[1]+'</b></span><span style="color:var(--cyan);font-weight:600">'+(LSORT===x[0]?(LDIR<0?'↓':'↑'):'')+'</span><span class="chk'+(LSORT===x[0]?' on':'')+'">'+(LSORT===x[0]?ic('check'):'')+'</span></button>').join('')+'<p style="margin-top:10px">Tap the selected one again to flip the order.</p>',s=>{
  s.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const k=b.dataset.s;if(LSORT===k)LDIR=-LDIR;else{LSORT=k;LDIR=(k==='name'||k==='type'||k==='genre')?1:-1;}SV('pf_sort',LSORT);SV('pf_dir',LDIR);closeLayer();SEL.clear();reload();});});}
function libMenu(){
 sheet('<h3>'+esc(V.title)+'</h3>'+mrow('check','Select items','closeLayer();SELMODE=true;selChrome()')+mrow('copy','Find duplicates in '+(CATN[V.cat]||'this list'),'closeLayer();dupAll()')+mrow('restore','Refresh','closeLayer();invalidateLib();render()'));}

function renderCat(){
 setBot('');window.PRE='';const my=GEN;libChrome();
 $('#main').innerHTML='<div class="empty">Loading…</div>';
 setTimeout(()=>{if(my!==GEN)return;
  const all=loadLib(V.cat);
  if(isAlb(V.cat)&&!V.album)return renderAlbums(all);
  let list=all;
  if(isAlb(V.cat)&&V.album!=='all')list=all.filter(it=>it.g.includes(V.album));
  if(V.cat==='docs'&&DOCF!=='all')list=list.filter(it=>DG[DOCF].includes(it.ext));
  list=sortItems(list);
  const mode=isAlb(V.cat)?VIEW:'list',tot=list.reduce((a,i)=>a+(i.s||0),0);
  let head='';
  if(V.cat==='docs')head='<div class="chips">'+[['all','All'],['pdf','PDF'],['word','Word'],['excel','Excel'],['ppt','PowerPoint'],['text','Text']].map(c=>'<button class="chip'+(DOCF===c[0]?' on':'')+'" onclick="DOCF=\''+c[0]+'\';SEL.clear();render()">'+c[1]+'</button>').join('')+'</div>';
  const sn={date:'date',time:'time',size:'size',name:'file name',type:'type',genre:'genre'}[LSORT];
  $('#main').innerHTML=head+'<div class="vinfo">'+list.length.toLocaleString()+' item'+(list.length===1?'':'s')+(tot?' · '+sz(tot):'')+' · by '+sn+' '+(LDIR<0?'↓':'↑')+'</div><div id="lib"></div>';
  drawItems(list,mode,'Nothing here yet. If you just added files, they may take a moment to show up.');
  selChrome();},15);}
function renderAlbums(all){
 const groups={all:all};ALB.forEach(a=>groups[a[0]]=[]);all.forEach(it=>it.g.forEach(g=>groups[g].push(it)));
 const label=V.cat==='photos'?'photos':'videos',defs=[['all','All '+label]].concat(ALB.map(a=>[a[0],a[1]]));
 const list=VIEW==='list';
 $('#main').innerHTML='<div class="albs'+(list?' l':'')+'">'+defs.map(d=>{const g=groups[d[0]],c=g.length;
  return'<button class="alb'+(c?'':' zero')+'" data-a="'+d[0]+'"><span class="cv">'+ic(V.cat)+(c?'<img loading="lazy" src="'+thumbUrl(g[0].p)+'" alt="" onerror="this.remove()">':'')+'</span><b>'+esc(d[1])+'</b><small>'+c.toLocaleString()+'</small></button>';}).join('')+'</div>';
 $('#main').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const d=defs.find(x=>x[0]===b.dataset.a);go({view:'cat',cat:V.cat,title:d[1],album:d[0]});});}
// draws a long list in chunks so 5000 photos stay smooth
function drawItems(items,mode,emptyMsg){
 CUR=items;const box=$('#lib');
 if(!items.length){box.innerHTML='<div class="empty">'+esc(emptyMsg||'Nothing here.')+'</div>';return;}
 const wrap=document.createElement('div');wrap.className=mode==='grid'?'grid':mode==='wf'?'wf':'';
 const sent=document.createElement('div');sent.style.height='1px';box.appendChild(wrap);box.appendChild(sent);
 const STEP=mode==='list'?100:240;let n=0;
 const add=()=>{if(n>=items.length)return;const end=Math.min(items.length,n+STEP);let h='';for(let i=n;i<end;i++)h+=rowHtml(items[i],i,mode!=='list');wrap.insertAdjacentHTML('beforeend',h);n=end;if(n>=items.length)sent.remove();};
 add();
 if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting))add();},{root:$('#main'),rootMargin:'1200px'});io.observe(sent);}
 else while(n<items.length)add();
 wireLib(box);}
function wireLib(box){
 let t=null,long=false;const stop=()=>clearTimeout(t);
 box.addEventListener('touchstart',e=>{const el=e.target.closest('[data-i]');if(!el)return;long=false;t=setTimeout(()=>{long=true;toggleSel(+el.dataset.i);},450);},{passive:true});
 box.addEventListener('touchmove',stop,{passive:true});box.addEventListener('touchend',stop);box.addEventListener('touchcancel',stop);
 box.addEventListener('contextmenu',e=>e.preventDefault());
 box.addEventListener('click',e=>{const el=e.target.closest('[data-i]');if(!el)return;if(long){long=false;return;}const i=+el.dataset.i;
  if(e.target.closest('[data-more]')){itemMenu(i);return;}
  if(SEL.size||SELMODE){toggleSel(i);return;}tapItem(i);});}
async function starSel(){const idx=[...SEL];if(!idx.length){toast('Select photos first');return;}
 const all=idx.every(i=>CUR[i].g&&CUR[i].g.includes('starred')),ps=idx.map(i=>CUR[i].p);
 N.setTagMany?N.setTagMany(JSON.stringify(ps),'Starred',!all):ps.forEach(p=>N.setTag(p,'Starred',!all));
 toast(all?'Removed from Starred':ps.length+' added to Starred');SEL.clear();SELMODE=false;invalidateLib();render();}

// ---------- duplicates ----------
function dupAll(){ONDUP={cat:V.cat,title:V.title};progressSheet('Finding duplicates','Looking through your '+(CATN[V.cat]||'files')+'…',true,()=>N.dupCancel());N.dupScan(V.cat);}
function dupOne(i){const it=CUR[i];if(!it)return;ONDUP={cat:kind(it.n),title:it.n,one:true};progressSheet('Finding duplicates','Comparing with your other '+(CATN[kind(it.n)]||'files')+'…',true,()=>N.dupCancel());N.dupOf(it.p);}
window.fmDupProgress=(d,t)=>setProg(d,t);
window.fmDupDone=r=>{closeLayer();if(r.cancelled){toast('Stopped');return;}
 if(!r.groups.length){toast(ONDUP&&ONDUP.one?'No duplicates of this file.':'No duplicates found.');return;}
 DSEL=new Set();go({view:'dup',groups:r.groups,cat:ONDUP.cat,title:ONDUP.one?'Duplicates of this file':'Duplicates'});};
function dupFree(){let n=0,b=0;V.groups.forEach((g,gi)=>g.forEach((it,j)=>{if(DSEL.has(gi+':'+j)){n++;b+=it.s||0;}}));return[n,b];}
function dupBot(){const[n,b]=dupFree();
 setBot('<div class="pickbar"><div class="pb2"><button class="btn sec" onclick="dupAuto()">Keep oldest</button><button class="btn red" '+(n?'':'disabled')+' onclick="dupDelete()">'+(n?'Delete '+n+' · '+sz(b):'Delete')+'</button></div></div>');}
function dupAuto(){DSEL=new Set();V.groups.forEach((g,gi)=>g.forEach((it,j)=>{if(j>0)DSEL.add(gi+':'+j);}));renderDup();}
function renderDup(){
 const G=V.groups;let free=0,copies=0;G.forEach(g=>{free+=(g[0].s||0)*(g.length-1);copies+=g.length;});
 setTop(subHeader(V.title,''));window.PRE='';
 $('#main').innerHTML='<div class="vinfo">'+G.length+' set'+(G.length===1?'':'s')+' of identical files · '+sz(free)+' can be freed. Same content, so any copy can go; the oldest is kept by default.</div>'+
  G.map((g,gi)=>'<div class="card dg"><div class="dgh">'+g.length+' copies <small>· '+sz(g[0].s||0)+' each</small></div>'+g.map((it,j)=>{
   const k=kind(it.n),on=DSEL.has(gi+':'+j);
   const lead=(k==='photos'||k==='videos')?'<img class="th" loading="lazy" src="'+thumbUrl(it.p)+'" data-open="'+esc(it.p)+'" alt="">':'<span class="ext c-'+k+'" data-open="'+esc(it.p)+'">'+esc((it.n.split('.').pop()||'').slice(0,4).toUpperCase())+'</span>';
   return'<div class="row'+(on?' pick':'')+'" data-d="'+gi+':'+j+'">'+lead+'<span class="rt"><b>'+esc(it.n)+'</b><span>'+(j===0?'<span class="keep">Oldest · </span>':'')+esc(it.p.replace(ROOT,'Internal storage').replace('/'+it.n,''))+' · '+esc(dt(it.m))+'</span></span><span class="chk'+(on?' on':'')+'">'+(on?ic('check'):'')+'</span></div>';}).join('')+'</div>').join('');
 $('#main').querySelectorAll('[data-d]').forEach(r=>r.addEventListener('click',e=>{const o=e.target.closest('[data-open]');if(o){N.open(o.dataset.open);return;}
  const key=r.dataset.d;DSEL.has(key)?DSEL.delete(key):DSEL.add(key);r.classList.toggle('pick',DSEL.has(key));const c=r.querySelector('.chk');c.classList.toggle('on',DSEL.has(key));c.innerHTML=DSEL.has(key)?ic('check'):'';dupBot();}));
 dupBot();}
async function dupDelete(){const[n,b]=dupFree();if(!n)return;
 const ok=await dlg({title:'Move '+n+' duplicate'+(n===1?'':'s')+' to Recently deleted?',msg:sz(b)+' will be freed. You can restore them for 30 days.',ok:'Delete',danger:true});if(!ok)return;
 const ps=[],gone=new Set();V.groups.forEach((g,gi)=>g.forEach((it,j)=>{if(DSEL.has(gi+':'+j)){ps.push(it.p);gone.add(it.p);}}));
 trashRun(ps,()=>{V.groups=V.groups.map(g=>g.filter(it=>!gone.has(it.p))).filter(g=>g.length>1);DSEL=new Set();invalidateLib();if(!V.groups.length){toast('All duplicates cleared');back();}else renderDup();});}
function renderRecent(){chrome();setBot(navbar());window.PRE='';PF={n:'recent',a:[]};ACC=pageFetch(PF,true);mountList(ACC,false,'No recent files yet.',MORE);}
function renderSearch(){
 setTop('<div class="hd sub"><button class="ib" onclick="back()" aria-label="Back">'+ic('back')+'</button><input id="q" placeholder="Search files" autocomplete="off" value="'+esc(V.q||'')+'" style="flex:1;min-width:0;height:44px;padding:0 12px;font-size:17px;font-family:inherit;color:var(--text);background:#000;border:1px solid rgba(255,255,255,.14);border-radius:12px;outline:none"></div>');setBot('');
 const q=$('#q');let t=null;const run=()=>{V.q=q.value;if(!q.value.trim()){$('#main').innerHTML='<div class="empty">Type part of a file name.</div>';CUR=[];return;}PF={n:'search',a:[q.value]};ACC=pageFetch(PF,true);window.PRE='';mountList(ACC,false,'No files match.',MORE);};
 q.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(run,250);});q.focus();run();}
function loadMore(){const a=pageFetch(PF,false);ACC=ACC.concat(a);CUR=ACC;const y=$('#main').scrollTop;mountList(ACC,false,'',MORE);$('#main').scrollTop=y;}

// tags
function renderTag(){chrome();setBot('');const a=J('tagFiles',V.tag)||[];window.PRE='';mountList(a,false,'No files with this tag yet. Open a file\'s ⋮ menu and choose Tag.');}
async function delTag(){const ok=await dlg({title:'Delete the tag "'+V.tag+'"?',msg:'Your files are not touched.',ok:'Delete',danger:true});if(!ok)return;N.deleteTag(V.tag);back();}
async function tagSheet(paths){
 const tags=J('tags')||[];const sets={};tags.forEach(t=>{sets[t.n]=new Set((J('tagFiles',t.n)||[]).map(x=>x.p));});
 const on=n=>paths.length>0&&paths.every(p=>sets[n]&&sets[n].has(p));
 const setMany=(n,v)=>{if(N.setTagMany)N.setTagMany(JSON.stringify(paths),n,v);else paths.forEach(p=>N.setTag(p,n,v));};
 sheet('<h3>Tag'+(paths.length>1?' '+paths.length+' items':'')+'</h3>'+tags.map(t=>'<button class="row" data-t="'+esc(t.n)+'"><span class="rt"><b>'+esc(t.n)+'</b></span><span class="chk'+(on(t.n)?' on':'')+'">'+(on(t.n)?ic('check'):'')+'</span></button>').join('')+
  '<button class="row" id="nt">'+ic('plus','li')+'<span class="rt"><b>New tag</b></span></button><div class="two"><button class="btn" id="dn">Done</button></div>',s=>{
  s.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const n=b.dataset.t,c=b.querySelector('.chk'),turnOn=!c.classList.contains('on');setMany(n,turnOn);c.classList.toggle('on',turnOn);c.innerHTML=turnOn?ic('check'):'';});
  s.querySelector('#nt').onclick=async()=>{closeLayer();const n=await dlg({title:'New tag',input:'',ok:'Create'});if(n&&n.trim()){if(N.addTag(n)!=='false')setMany(n.trim().slice(0,24),true);}tagSheet(paths);};
  s.querySelector('#dn').onclick=()=>{closeLayer();SEL.clear();if(V.view==='cat'){SELMODE=false;invalidateLib();render();return;}if(V.view==='tag'||V.view==='home')render();else selChrome();};});}

// item actions
function itemMenu(i){const it=CUR[i];if(!it)return;
 const q=J('quick')||[];const isQ=q.some(x=>x.p===it.p);const pinned=!it.d&&String(N.isPinned(it.p))==='true';
 sheet('<h3>'+esc(it.n)+'</h3><p>'+esc(it.p.replace(ROOT,'Internal storage'))+'</p>'+
  (it.d?'':mrow('open','Open','closeLayer();N.open(CUR['+i+'].p)')+mrow('share','Share','closeLayer();N.share(CUR['+i+'].p)'))+
  mrow('bookmark','Tag','closeLayer();tagSheet([CUR['+i+'].p])')+
  (it.d?'':mrow('files','Add to File Dock','closeLayer();toast(N.addDock(CUR['+i+'].p)||\'Added to the File Dock\')')+mrow('star',pinned?'Unpin from Quick files':'Pin to Quick files','closeLayer();toast(N.pinFile(CUR['+i+'].p,'+(!pinned)+')||\''+(pinned?'Unpinned':'Pinned to Quick files')+'\')'))+
  (it.d?mrow('star',isQ?'Remove from Quick access':'Add to Quick access','closeLayer();toggleQuick('+i+')'):'')+
  (it.d||kind(it.n)==='other'?'':mrow('copy','Find duplicates of this','closeLayer();dupOne('+i+')'))+
  mrow('edit','Rename','closeLayer();renameIt('+i+')')+mrow('copy','Copy path','closeLayer();N.copyText(CUR['+i+'].p)')+
  mrow('info','Details','closeLayer();details('+i+')')+(V.view==='trash'?'':mrow('trash','Delete','closeLayer();delOne('+i+')',true)));}
function toggleQuick(i){const it=CUR[i];const q=J('quick')||[];if(q.some(x=>x.p===it.p)){N.removeQuick(it.p);toast('Removed from Quick access');}else{N.addQuick(it.p);toast('Added to Quick access');}}
async function renameIt(i){const it=CUR[i];const n=await dlg({title:'Rename',input:it.n,ok:'Rename'});if(n===null||n===it.n)return;const e=N.rename(it.p,n);if(e)toast(e);else{toast('Renamed');setTimeout(reload,300);}}
async function delOne(i){const it=CUR[i];const ok=await dlg({title:'Move "'+it.n+'" to Recently deleted?',msg:'You can restore it for 30 days.',ok:'Delete',danger:true});if(!ok)return;N.trash(JSON.stringify([it.p]));invalidateLib();toast('Moved to Recently deleted');setTimeout(reload,300);}
function details(i){const it=CUR[i];const f=J('info',it.p)||it;
 sheet('<h3>'+esc(f.n||it.n)+'</h3><p>'+esc('Where: '+(f.p||it.p).replace(ROOT,'Internal storage')+'\nSize: '+sz(f.s||0)+(f.d?' · '+(f.files||0)+' files':'')+'\nType: '+(f.d?'Folder':(f.mime||'file'))+'\nModified: '+dt(f.m))+'</p><div class="two"><button class="btn" onclick="closeLayer()">Close</button></div>');}

// bin
function renderTrash(){chrome();setBot('');const a=J('trashList')||[];window.PRE='<div class="hint" style="margin:10px 4px;font-size:13.5px;color:var(--sub)">Items are removed for good after 30 days.</div>';
 CUR=a;
 $('#main').innerHTML=window.PRE+(a.length?a.map((it,i)=>'<div class="row" data-i="'+i+'">'+(it.d?'<span class="ext c-folder">'+ic('folder')+'</span>':'<span class="ext c-'+kind(it.n)+'">'+esc((it.n.split('.').pop()||'').slice(0,4).toUpperCase())+'</span>')+'<span class="rt"><b>'+esc(it.n)+'</b><span>Deleted '+esc(dt(it.ts))+' · '+(it.d?'folder':sz(it.s))+'</span></span><button class="ib" data-more="'+i+'" aria-label="More">'+ic('more')+'</button></div>').join(''):'<div class="empty">Nothing here.</div>');
 $('#main').querySelectorAll('[data-i]').forEach(e=>e.addEventListener('click',()=>binMenu(+e.dataset.i)));}
function binMenu(i){const it=CUR[i];sheet('<h3>'+esc(it.n)+'</h3><p>'+esc('From '+it.orig.replace(ROOT,'Internal storage'))+'</p>'+
 mrow('restore','Restore','closeLayer();restoreIt('+i+')')+mrow('trash','Delete forever','closeLayer();foreverIt('+i+')',true));}
function restoreIt(i){const e=N.restore(CUR[i].id);if(e)toast(e);else toast('Restored');renderTrash();}
async function foreverIt(i){const ok=await dlg({title:'Delete "'+CUR[i].n+'" forever?',msg:'This can\'t be undone.',ok:'Delete forever',danger:true});if(!ok)return;N.deleteForever(CUR[i].id);renderTrash();}
async function emptyBin(){const a=J('trashList')||[];if(!a.length)return;const ok=await dlg({title:'Empty Recently deleted?',msg:'All '+a.length+' item'+(a.length===1?'':'s')+' will be gone for good.',ok:'Empty',danger:true});if(!ok)return;N.emptyTrash();renderTrash();}

render();
</script></body></html>
