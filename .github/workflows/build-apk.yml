name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android SDK (runner's own copy)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Fetch sherpa-onnx (speech libraries)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/fetch_sherpa.sh

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log

      - name: Show only the errors
        if: failure()
        run: |
          echo "===== Kotlin / Java errors ====="
          grep -E "^e: |error:" build.log | head -60 || true
          echo "===== What went wrong ====="
          grep -A6 "What went wrong" build.log | head -40 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pragon-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
