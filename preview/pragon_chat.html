header{position:relative;display:flex;align-items:center;gap:6px;padding:10px 12px 10px 16px;min-height:64px;background:rgba(0,0,0,.88)}
header img{width:36px;height:36px;object-fit:contain}
.t{flex:1;min-width:0;padding-left:4px}
.t b{display:block;font-weight:600;font-size:21px;letter-spacing:.18em;color:var(--silver)}
.t small{display:block;font-size:10px;letter-spacing:.04em;color:#7fd3e899;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ash{height:44px;min-width:44px;border-radius:12px;border:1px solid #ffffff1a;background:linear-gradient(#0c0e12,#040506,#080a0d);color:var(--icon);font:600 12.5px Newsreader,serif;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;cursor:pointer;transition:transform .1s}
.ash:active,.chip:active,#send:active{transform:scale(.94)}
.ash svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hl{position:relative;height:1px;background:linear-gradient(90deg,#00d4ff00,#00d4ff80,#00d4ff00)}
#list{position:relative;flex:1;overflow-y:auto;padding:16px 16px 12px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
#list::-webkit-scrollbar{display:none}
.m{max-width:84%;padding:11px 14px;border-radius:18px;font-size:17px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.a{align-self:flex-start;background:#00d4ff14;border:1px solid #00d4ff55;border-bottom-left-radius:5px;color:#d9f6ff}
.u{align-self:flex-end;background:linear-gradient(#161a20cc,#0a0c10cc);border:1px solid #ffffff22;border-bottom-right-radius:5px}
.typing{display:flex;gap:5px;padding:14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--cyan);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-4px)}}
#dock{position:relative;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.88)}
.row{display:flex;gap:8px;margin-top:8px;align-items:center}
.chip{flex:1;height:44px;border-radius:12px;font:600 12px Newsreader,serif;letter-spacing:.08em;cursor:pointer;transition:transform .1s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
#mode{flex:1}#eng{flex:1.3;color:var(--silver);background:linear-gradient(#0c0e12,#040506,#080a0d);border:1px solid #ffffff1a}
#att{font-size:12px;color:#7fd3e8;display:none;cursor:pointer}
#in{flex:1;height:48px;border-radius:14px;border:1px solid #ffffff22;background:#0a0c10;color:#fff;font:17px Newsreader,serif;padding:0 14px;outline:none}
#in:focus{border-color:#00d4ff88}
#send{width:48px;height:48px;border-radius:14px;border:1px solid #00d4ff57;background:linear-gradient(#0b4660,#06222f);color:#bff3ff;cursor:pointer;transition:transform .1s;display:flex;align-items:center;justify-content:center}
#send svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

<script>
const $=id=>document.getElementById(id);
const modes=[{n:'ASSISTANT',c:'#c4a6ff'},{n:'MASTER',c:'#00d4ff'},{n:'AGENT',c:'#6ee7b7'}];
const engines=['PRAGON · ONLINE','GHOST · llama3.2:3b','CUSTOM'];
const wmLv=[1,.7,.4,.15],wmNm=['100%','70%','40%','15%'];
let mi=1,ei=0,wi=2,muted=false,confirmClr=false,files=[],busy=false;
function paintMode(){const m=modes[mi];const b=$('mode');b.textContent=m.n;b.style.color=m.c;b.style.background=m.c+'1a';b.style.border='1px solid '+m.c+'66'}
function add(t,cls){const d=document.createElement('div');d.className='m '+cls;d.textContent=t;$('list').appendChild(d);$('list').scrollTop=1e9;return d}
function typing(){const d=document.createElement('div');d.className='m a typing';d.innerHTML='<i></i><i></i><i></i>';$('list').appendChild(d);$('list').scrollTop=1e9;return d}
function reply(q){
  if(/^open /i.test(q)){return mi==2?'':mi==0?'I can only advise in Assistant mode, sir.':q.slice(5)+' opened, sir.'}
  return 'Demo reply: connect this page to your Pragon backend to get real answers.'}
function send(){
  const q=$('in').value.trim();if(!q||busy)return;
  add(q+(files.length?'\n📎 '+files.map(f=>f.name).join(', '):''),'u');$('in').value='';files=[];paintAtt();busy=true;
  const t=typing();setTimeout(()=>{t.remove();const r=reply(q);if(r)add(r,'a');busy=false},900)}
function paintAtt(){const a=$('att');if(!files.length){a.style.display='none';return}a.style.display='flex';a.textContent='📎 '+files.map(f=>f.name).join(', ')+'   (tap to remove)'}
$('att').onclick=()=>{files=[];paintAtt()};
$('send').onclick=send;$('in').onkeydown=e=>{if(e.key==='Enter')send()};
$('mode').onclick=()=>{mi=(mi+1)%3;paintMode()};
$('eng').onclick=()=>{ei=(ei+1)%3;$('eng').textContent=engines[ei]};
$('wmb').onclick=()=>{wi=(wi+1)%4;document.documentElement.style.setProperty('--wm',wmLv[wi]);$('wml').textContent=wmNm[wi]};
$('clr').onclick=()=>{if(!confirmClr){confirmClr=true;$('clr').style.color='#ff6b6b';setTimeout(()=>{confirmClr=false;$('clr').style.color=''},2500);return}
  $('list').innerHTML='';confirmClr=false;$('clr').style.color=''};
$('mute').onclick=()=>{muted=!muted;$('wave').style.display=muted?'none':''};
$('clip').onclick=()=>$('file').click();
$('file').onchange=e=>{files=[...files,...e.target.files];paintAtt();e.target.value=''};
$('mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){add('Voice input is not supported in this browser.','a');return}
  const r=new SR();r.onresult=e=>{$('in').value=e.results[0][0].transcript;send()};r.start()};
$('flt').onclick=()=>add('Float mode is available in the Android app.','a');
$('gear').onclick=()=>add('Settings open in the Android app.','a');
paintMode();$('eng').textContent=engines[0];
add("Good day, sir. I am Pragon. Type or speak. Tap the left chip to change my mode.",'a');
</script></body></html>
